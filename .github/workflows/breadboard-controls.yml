name: BreadBoard A1 controls

on:
  pull_request:
    branches:
      - breadboard/main
    paths:
      - .github/workflows/**
      - NOTICE.md
      - THIRD_PARTY_NOTICES/**
      - bun.lock
      - package.json
      - scripts/**

permissions:
  contents: read

concurrency:
  group: breadboard-a1-${{ github.event.pull_request.number }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  controls:
    name: Provenance and predicate controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root validator dependency
        run: bun install --frozen-lockfile --ignore-scripts --filter omp

      - name: Run focused A1 controls
        run: bun run ci:breadboard-controls
